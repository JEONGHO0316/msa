# api-gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: petclinic
  labels:
    app: api-gateway
  # ❌ 여기에 있던 annotations를 지웠습니다. (여기는 소프트웨어 설정 공간)
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          # 👇 사용자님 계정 ID 유지
          image: 639242342449.dkr.ecr.ap-northeast-2.amazonaws.com/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "default"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-server:8761/eureka/"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: petclinic
  # ✅ [중요] 로드밸런서 설정은 무조건 Service의 metadata에 있어야 합니다!
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb" 
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80           # 외부 접속 포트
      targetPort: 8080   # 내부 컨테이너 포트
      protocol: TCP
  type: LoadBalancer     # AWS 로드밸런서 생성
