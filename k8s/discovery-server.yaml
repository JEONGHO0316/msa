# discovery-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: petclinic
  labels:
    app: discovery-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          # 👇 본인 AWS 계정 ID로 수정 필수!
          image: 639242342449.dkr.ecr.ap-northeast-2.amazonaws.com/discovery-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
          env:
            # 아까 띄운 Config Server의 주소를 알려줍니다.
            # (같은 네임스페이스 안이라서 이름만으로 찾을 수 있습니다.)
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
          
          # 헬스 체크 (서버가 진짜 살았는지 확인)
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: petclinic
spec:
  selector:
    app: discovery-server
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761
  type: ClusterIP
