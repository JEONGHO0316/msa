# --- EC2NodeClass (AWS 설정) ---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "KarpenterNodeRole-final-cluster"  # <-- [수정] 아까 만든 Node Role 이름 (예: KarpenterNodeRole-my-cluster)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "final-cluster" # <-- [수정] 내 클러스터 이름
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "final-cluster" # <-- [수정] 내 클러스터 이름 (일반적으로 EKS 클러스터 SG)

---
# --- NodePool (스케줄링 정책) ---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c", "m", "r"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["5"]
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
